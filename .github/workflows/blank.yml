

name: Build Tuition Saathi APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          unzip tuition-saathi-android-project.zip

      - name: Build APK
        run: |
          cd tuition-saathi-android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuition-saathi-apk
          path: tuition-saathi-android/app/build/outputs/apk/debug/app-debug.apk
